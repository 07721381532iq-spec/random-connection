<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Random Connection</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center}.container{text-align:center;background:white;padding:40px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}h1{font-size:3rem;color:#333}button{padding:20px 40px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;border-radius:50px;font-size:1.2rem;cursor:pointer;margin-top:20px;transition:transform 0.3s}button:hover{transform:scale(1.05)}</style></head><body><div class="container"><h1>Random Connection</h1><button id="discoverBtn">Discover Something New</button></div><script>document.getElementById("discoverBtn").addEventListener("click",()=>{const sites=["https://NASA.gov","https://Wikipedia.org","https://archive.org"];window.open(sites[Math.floor(Math.random()*sites.length)],"_blank")})</script></body></html>
